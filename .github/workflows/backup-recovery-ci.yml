name: Backup and recovery Windows verification
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        shell: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PITR_NOUPDATE: '1'
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Source syntax and encoding on actual engine
        run: |
          $ErrorActionPreference='Stop'
          & ./tools/Test-Source.ps1
      - name: Execute each behavior suite in an isolated engine
        run: |
          $ErrorActionPreference='Stop'
          $engine=(Get-Process -Id $PID).Path
          foreach($test in Get-ChildItem -LiteralPath ./tests -Filter '*.Tests.ps1' -File | Sort-Object Name) {
            Write-Host ('SUITE '+$test.Name)
            & $engine -NoProfile -ExecutionPolicy Bypass -File $test.FullName
            if($LASTEXITCODE -ne 0) { throw ('Failed suite: '+$test.Name) }
          }
      - name: Actual original CMD selftest without elevation or mutation
        shell: cmd
        run: |
          call pitr-config.cmd selftest
          if errorlevel 1 exit /b 1
      - name: Build and inspect immutable portable ZIP
        run: |
          $ErrorActionPreference='Stop'
          $source=(git rev-parse HEAD).Trim()
          if ($source -ne $env:GITHUB_SHA) { throw 'Checkout does not match intended CI source SHA' }
          $artifact=& ./tools/Build-Portable.ps1 -OutDirectory (Join-Path $env:RUNNER_TEMP 'pitr-dist') -SourceCommit $source
          $artifact | ConvertTo-Json | Write-Host
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expanded=Join-Path $env:RUNNER_TEMP "PITR portable (1) O'Brien & A!"
          [IO.Compression.ZipFile]::ExtractToDirectory($artifact.Path,$expanded)
          $inventory=Get-Content -LiteralPath (Join-Path $expanded 'package-integrity.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($inventory.SourceCommit -ne $source) { throw 'ZIP source provenance mismatch' }
          $expected=@($inventory.Files | ForEach-Object { $_.Path } | Sort-Object)
          $actual=@(Get-ChildItem -LiteralPath $expanded -Recurse -File | ForEach-Object { $_.FullName.Substring($expanded.Length+1).Replace('\','/') } | Where-Object { $_ -ne 'package-integrity.json' } | Sort-Object)
          if (@(Compare-Object $expected $actual).Count -ne 0) { throw 'ZIP inventory member set mismatch' }
          foreach($required in @('START-HERE.cmd','TESTING.md','docs/BACKUP-RECOVERY-GUIDE.md','src/backup/Ui.ps1')) {
            if (-not (Test-Path -LiteralPath (Join-Path $expanded $required))) { throw ('Testing ZIP missing '+$required) }
          }
          foreach($file in $inventory.Files) {
            $path=Join-Path $expanded $file.Path
            if((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $file.Sha256) { throw ('Packaged hash mismatch: '+$file.Path) }
          }
          & (Join-Path $expanded 'START-HERE.cmd') --help
          if($LASTEXITCODE -ne 0) { throw 'Extracted START-HERE launcher help failed' }
          & (Join-Path $expanded 'pitr-backup.cmd') --help
          if($LASTEXITCODE -ne 0) { throw 'Extracted portable launcher help failed' }
          & (Join-Path $expanded 'pitr-config.cmd') selftest
          if($LASTEXITCODE -ne 0) { throw 'Extracted original hybrid selftest failed' }
          & ./tests/LauncherStartupWindows.Tests.ps1 -PackageRoot $expanded
          if(-not $?) { throw 'Extracted no-argument native CMD/WPF proof failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-${{ matrix.os }}-${{ matrix.shell }}
          path: |
            ${{ runner.temp }}/pitr-dist/*
            ${{ runner.temp }}/pitr-ui-proof/*
          if-no-files-found: ignore
